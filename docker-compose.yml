# Project-scoped name so compose resources don't collide with other stacks.
name: mini-operations-wallet-portal

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      # The Postgres image expects POSTGRES_*; we feed it from the same DB_* vars
      # the app uses so there is a single set of credentials in .env.
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-mini_operations_wallet_portal}
    ports:
      # Expose Postgres on a non-default host port so it won't clash with a local Postgres on 5432.
      - '${DB_PORT:-5433}:5432'
    volumes:
      - mini_operations_wallet_portal_pgdata:/var/lib/postgresql/data
    healthcheck:
      # The app waits for this to pass before starting, so migrations don't hit a cold DB.
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-mini_operations_wallet_portal}']
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: ${PORT:-3001}
      # Inside the compose network the DB host is the service name "db", not localhost.
      DB_HOST: db
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-mini_operations_wallet_portal}
    ports:
      - '${PORT:-3001}:${PORT:-3001}'

  # Next.js UI. Browser → web:3000/backend/* → Next rewrite → app:3001/* on the
  # Compose network (service DNS name "app"). One `docker compose up` runs all three.
  web:
    build:
      context: ./front-end
      args:
        NEXT_PUBLIC_API_URL: /backend
        API_PROXY_TARGET: http://app:3001
    restart: unless-stopped
    depends_on:
      - app
    environment:
      NEXT_PUBLIC_API_URL: /backend
      API_PROXY_TARGET: http://app:3001
    ports:
      - '3000:3000'

volumes:
  mini_operations_wallet_portal_pgdata:
