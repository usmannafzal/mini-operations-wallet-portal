services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      # The Postgres image expects POSTGRES_*; we feed it from the same DB_* vars
      # the app uses so there is a single set of credentials in .env.
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-wallet}
    ports:
      # Expose Postgres on the host so you can also run the app locally (yarn start:dev) against it.
      - '${DB_PORT:-5432}:5432'
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      # The app waits for this to pass before starting, so migrations don't hit a cold DB.
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-wallet}']
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: ${PORT:-3000}
      # Inside the compose network the DB host is the service name "db", not localhost.
      DB_HOST: db
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-wallet}
    ports:
      - '${PORT:-3000}:${PORT:-3000}'

volumes:
  db_data:
